services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpasswd
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U user -d calendar
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  schema-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: userpasswd
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        psql \
          --host postgres \
          --username user \
          --dbname calendar \
          --set ON_ERROR_STOP=1 <<'SQL'

        CREATE SCHEMA IF NOT EXISTS calendar AUTHORIZATION "user";

        CREATE TABLE IF NOT EXISTS calendar.events (
            id BIGSERIAL PRIMARY KEY,
            title TEXT NOT NULL,
            description TEXT NOT NULL,
            "time" TIMESTAMPTZ NOT NULL,
            duration BIGINT NOT NULL,
            owner TEXT NOT NULL,
            notifyleadtime BIGINT NOT NULL,
            sheduled BOOLEAN NOT NULL DEFAULT FALSE
        );

        SQL