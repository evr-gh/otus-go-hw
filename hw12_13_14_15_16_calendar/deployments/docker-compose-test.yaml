services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpasswd
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U user -d calendar
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  schema-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: userpasswd
    volumes:
      - ../migrations/init.sql:/migrations/init.sql:ro
    entrypoint:
      - psql
    command:
      - --host=postgres
      - --username=user
      - --dbname=calendar
      - --set=ON_ERROR_STOP=1
      - --file=/migrations/init.sql